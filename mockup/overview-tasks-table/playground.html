<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MVP 1 — Overview playground (db-scheduler-ui)</title>
<style>
  :root {
    --bg:#0e0f12; --panel:#16181d; --panel2:#1d2027; --line:#2a2e37;
    --txt:#e6e8ec; --dim:#9aa1ac; --accent:#5b9dff; --accent2:#2f9e44;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    /* spec tokens (light preview) */
    --s-red:#c92a2a; --s-blue:#1971c2; --s-green:#2f9e44; --s-grey:#71717a;
    --s-mute:#adb5bd; --s-orange:#e8590c; --s-dotgrey:#ced4da; --s-border:#e4e4e7;
    --s-failtint:#fff5f5; --s-runtint:#f0f7ff; --s-pagebg:#f4f4f5; --s-card:#ffffff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--ui); display:flex; height:100vh; overflow:hidden; }

  /* ---- controls ---- */
  #controls { width:340px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:16px 16px 40px; }
  #controls h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #controls .sub { font-size:11px; color:var(--dim); margin:0 0 14px; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .presets button { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:7px; padding:6px 9px; font-size:11px; cursor:pointer; }
  .presets button:hover { border-color:var(--accent); }
  .grp { border-top:1px solid var(--line); padding:12px 0 4px; }
  .grp > .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; font-size:12px; }
  .row label { color:var(--txt); }
  select, input[type=text] { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:4px 6px; font-size:12px; font-family:var(--ui); }
  input[type=range] { width:130px; }
  .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:var(--panel2); color:var(--dim); border:0; padding:4px 8px; font-size:11px; cursor:pointer; }
  .seg button.on { background:var(--accent); color:#fff; }
  .switch { position:relative; width:34px; height:18px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#3a3f4a; border-radius:999px; transition:.15s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:14px; height:14px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(16px); }

  /* ---- stage ---- */
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  #preview-wrap { flex:1; overflow:auto; background:#3a3d44; padding:28px; display:flex; justify-content:center; }
  #prompt-wrap { flex:none; border-top:1px solid var(--line); background:var(--panel); padding:12px 16px; }
  #prompt-wrap .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  #prompt-wrap .head .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  #copyBtn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; }
  #prompt { font-family:var(--mono); font-size:12px; line-height:1.5; color:var(--txt); white-space:pre-wrap;
    max-height:150px; overflow:auto; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:0; }

  /* ---- the actual Overview preview (light theme, spec tokens) ---- */
  .ov { width:1180px; max-width:1180px; background:var(--s-pagebg); border:1px solid #bdbdbd; border-radius:10px;
    font-family:var(--ui); color:#1e1e1e; padding:0 0 24px; --rowH:60px; --rowPad:11px; --nameFs:15px; --subFs:12px; }
  .ov.compact { --rowH:44px; --rowPad:6px; --nameFs:14px; --subFs:11px; }
  .ov .topnav { display:flex; align-items:center; gap:26px; background:#fff; border:1px solid var(--s-border);
    border-radius:8px; margin:20px; padding:0 17px; height:56px; }
  .ov .brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:600; }
  .ov .brand .b-dot { width:18px; height:18px; border-radius:50%; background:var(--s-blue); }
  .ov .tab { font-size:15px; color:var(--s-grey); position:relative; padding-bottom:6px; cursor:default; }
  .ov .tab.active { color:var(--s-blue); }
  .ov .tab.active:after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--s-blue); }
  .ov .ro-badge { margin-left:auto; font-size:11px; color:var(--s-grey); border:1px solid var(--s-border);
    border-radius:999px; padding:2px 9px; background:#fafafa; }
  .ov h2 { font-size:26px; margin:8px 20px 4px; font-weight:600; }
  .ov .colhdr, .ov .secthdr, .ov .cardline { margin:0 28px; }
  .ov .colhdr { display:grid; grid-template-columns:1fr 150px 220px 92px; gap:8px; padding:18px 14px 2px;
    font-size:11px; letter-spacing:.04em; color:#a1a1aa; }
  .ov .secthdr { font-size:12px; color:var(--s-grey); padding:14px 0 6px; letter-spacing:.02em; }
  .ov .card { display:grid; grid-template-columns:1fr 150px 220px 92px; gap:8px; align-items:center;
    background:var(--s-card); border:1px solid var(--s-border); border-radius:8px; margin:8px 28px 0;
    min-height:var(--rowH); padding:var(--rowPad) 16px; }
  .ov .card.tint-fail { background:var(--s-failtint); }
  .ov .card.tint-run  { background:var(--s-runtint); }
  .ov .c-task { display:flex; align-items:center; gap:14px; min-width:0; }
  .ov .marker { flex:none; display:flex; align-items:center; }
  .ov .dot { width:12px; height:12px; border-radius:50%; }
  .ov .pill { font-size:10px; line-height:1; padding:3px 7px; border-radius:999px; color:#fff; font-weight:600;
    text-transform:lowercase; white-space:nowrap; }
  .ov .c-text { min-width:0; }
  .ov .c-name { font-size:var(--nameFs); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ov .c-sub { font-size:var(--subFs); color:var(--s-grey); margin-top:2px; }
  .ov .c-next { font-size:13px; }
  .ov .c-last { font-size:12px; }
  .ov .c-link { font-size:12px; text-align:left; }
  .ov .warn { color:var(--s-orange); cursor:help; margin-left:4px; }
  .fail { color:var(--s-red); } .run { color:var(--s-blue); } .ok { color:var(--s-green); }
  .grey { color:var(--s-grey); } .mute { color:var(--s-mute); } .over { color:var(--s-orange); }
  .link { color:var(--s-blue); }
  .d-fail{background:var(--s-red);} .d-run{background:var(--s-blue);} .d-sched{background:var(--s-dotgrey);} .d-dorm{background:var(--s-dotgrey); opacity:.55;}
</style>
</head>
<body>
<div id="controls">
  <h1>MVP 1 — Overview playground</h1>
  <p class="sub">db-scheduler-ui · task-centric dashboard. Tweak the spec's design decisions, then copy the prompt.</p>

  <div class="presets" id="presets"></div>

  <div class="grp">
    <div class="lbl">Scenario (fleet data)</div>
    <div class="row"><label>Sample fleet</label>
      <select id="scenario">
        <option value="spec">Spec sample (all states)</option>
        <option value="healthy">Healthy fleet</option>
        <option value="incident">Incident (failures)</option>
        <option value="deploy">Fresh deploy (dormant)</option>
        <option value="fanout">Big fan-out (multi-instance)</option>
      </select>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Status indicator (a11y)</div>
    <div class="row"><label>Style</label>
      <select id="indicator">
        <option value="dot-label">Dot + word (spec)</option>
        <option value="pill">Pill / badge</option>
        <option value="label-only">Word only (no dot)</option>
        <option value="dot-only">Dot only (color-only ⚠)</option>
      </select>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Sub-line</div>
    <div class="row"><label>Time-in-state duration</label>
      <span class="switch"><input type="checkbox" id="showDuration" checked><span class="slider"></span></span></div>
    <div class="row"><label>Instance count on recurring</label>
      <span class="switch"><input type="checkbox" id="recCount"><span class="slider"></span></span></div>
  </div>

  <div class="grp">
    <div class="lbl">Columns</div>
    <div class="row"><label>Last-run format</label>
      <div class="seg" id="lastFmt"><button data-v="relative" class="on">relative</button><button data-v="absolute">absolute</button></div>
    </div>
    <div class="row"><label>Running label</label>
      <select id="runLabel">
        <option value="running now">running now (spec)</option>
        <option value="running">running</option>
        <option value="active">active</option>
        <option value="in progress">in progress</option>
      </select>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Row tint</div>
    <div class="row"><label>Tint failing rows</label>
      <span class="switch"><input type="checkbox" id="tintFail" checked><span class="slider"></span></span></div>
    <div class="row"><label>Tint running rows</label>
      <span class="switch"><input type="checkbox" id="tintRun" checked><span class="slider"></span></span></div>
  </div>

  <div class="grp">
    <div class="lbl">Density</div>
    <div class="row"><label>Compact</label>
      <span class="switch"><input type="checkbox" id="compact"><span class="slider"></span></span></div>
  </div>

  <div class="grp">
    <div class="lbl">Chrome / config</div>
    <div class="row"><label>History tab (history=true)</label>
      <span class="switch"><input type="checkbox" id="historyTab" checked><span class="slider"></span></span></div>
    <div class="row"><label>Read-only badge</label>
      <span class="switch"><input type="checkbox" id="readOnly"><span class="slider"></span></span></div>
  </div>
</div>

<div id="stage">
  <div id="preview-wrap"><div class="ov" id="ov"></div></div>
  <div id="prompt-wrap">
    <div class="head"><span class="lbl">Prompt — paste back to Claude</span><button id="copyBtn">Copy prompt</button></div>
    <pre id="prompt"></pre>
  </div>
</div>

<script>
"use strict";

const DEFAULTS = {
  scenario:"spec", indicator:"dot-label", showDuration:true, recCount:false,
  lastFmt:"relative", runLabel:"running now", tintFail:true, tintRun:true,
  compact:false, historyTab:true, readOnly:false,
};
const state = {...DEFAULTS};

// ---------- fleet scenarios ----------
// next.kind: in | overdue | running | none | soonest ; value e.g. "5m"
// last: {success:"3d"|null, failure:"2m"|null, show:"success"|"failure", never:bool}
function R(o){ return Object.assign({section:"recurring"},o); }
function O(o){ return Object.assign({section:"onetime"},o); }

const SCENARIOS = {
  spec: [
    R({name:"cleanup-recurring-task", st:"dormant", next:{kind:"none"}, last:{success:"3d", show:"success"}, abnormal:true}),
    R({name:"failing-recurring-task", st:"failing", failFor:"4d", next:{kind:"in",value:"5m"}, last:{failure:"2m", show:"failure"}}),
    R({name:"hourly-report-task", st:"scheduled", next:{kind:"in",value:"26m"}, last:{success:"34m", show:"success"}}),
    R({name:"long-running-recurring-task", st:"running", runFor:"2h", next:{kind:"running"}, last:{success:"3d", show:"success"}}),
    R({name:"recurring-task", st:"scheduled", next:{kind:"in",value:"1h"}, last:{success:"2m", show:"success"}}),
    O({name:"chained-step-2", st:"scheduled", inst:1, next:{kind:"in",value:"6s"}, last:{success:"2m", show:"success"}}),
    O({name:"failing-one-time-task", st:"failing", inst:1, next:{kind:"overdue",value:"3h"}, last:{failure:"2m", show:"failure"}}),
    O({name:"import-job", st:"dormant", inst:0, next:{kind:"none"}, last:{never:true}}),
    O({name:"onetime-spawned-task", st:"multi", inst:100, counts:{failing:3,running:2,scheduled:95}, next:{kind:"soonest",value:"12s"}, last:{failure:"3d", show:"failure"}}),
  ],
  healthy: [
    R({name:"cleanup-recurring-task", st:"scheduled", next:{kind:"in",value:"4h"}, last:{success:"20m", show:"success"}}),
    R({name:"hourly-report-task", st:"scheduled", next:{kind:"in",value:"26m"}, last:{success:"34m", show:"success"}}),
    R({name:"metrics-rollup", st:"running", runFor:"3s", next:{kind:"running"}, last:{success:"1h", show:"success"}}),
    R({name:"recurring-task", st:"scheduled", next:{kind:"in",value:"1h"}, last:{success:"2m", show:"success"}}),
    O({name:"chained-step-2", st:"scheduled", inst:1, next:{kind:"in",value:"6s"}, last:{success:"2m", show:"success"}}),
    O({name:"welcome-email", st:"scheduled", inst:3, next:{kind:"in",value:"45s"}, last:{success:"5m", show:"success"}}),
  ],
  incident: [
    R({name:"failing-recurring-task", st:"failing", failFor:"4d", next:{kind:"in",value:"5m"}, last:{failure:"2m", show:"failure"}}),
    R({name:"billing-sync", st:"failing", failFor:"18h", next:{kind:"overdue",value:"40m"}, last:{failure:"40m", show:"failure"}}),
    R({name:"long-running-recurring-task", st:"running", runFor:"2h", next:{kind:"running"}, last:{success:"3d", show:"success"}}),
    R({name:"hourly-report-task", st:"scheduled", next:{kind:"in",value:"26m"}, last:{success:"34m", show:"success"}}),
    O({name:"failing-one-time-task", st:"failing", inst:1, next:{kind:"overdue",value:"3h"}, last:{failure:"2m", show:"failure"}}),
    O({name:"onetime-spawned-task", st:"multi", inst:100, counts:{failing:12,running:2,scheduled:86}, next:{kind:"soonest",value:"12s"}, last:{failure:"3d", show:"failure"}}),
  ],
  deploy: [
    R({name:"cleanup-recurring-task", st:"dormant", next:{kind:"none"}, last:{never:true}, abnormal:true}),
    R({name:"hourly-report-task", st:"dormant", next:{kind:"none"}, last:{never:true}, abnormal:true}),
    R({name:"recurring-task", st:"scheduled", next:{kind:"in",value:"1h"}, last:{never:true}}),
    O({name:"import-job", st:"dormant", inst:0, next:{kind:"none"}, last:{never:true}}),
    O({name:"backfill-task", st:"dormant", inst:0, next:{kind:"none"}, last:{never:true}}),
  ],
  fanout: [
    R({name:"recurring-task", st:"scheduled", next:{kind:"in",value:"1h"}, last:{success:"2m", show:"success"}}),
    O({name:"onetime-spawned-task", st:"multi", inst:2400, counts:{failing:18,running:31,scheduled:2351}, next:{kind:"soonest",value:"2s"}, last:{failure:"6m", show:"failure"}}),
    O({name:"shard-rebalance", st:"multi", inst:64, counts:{failing:0,running:8,scheduled:56}, next:{kind:"soonest",value:"9s"}, last:{success:"1m", show:"success"}}),
    O({name:"notify-user", st:"multi", inst:512, counts:{failing:0,running:0,scheduled:512}, next:{kind:"soonest",value:"30s"}, last:{success:"3m", show:"success"}}),
  ],
};

// ---------- helpers ----------
const UNIT = {s:1, m:60, h:3600, d:86400};
function offSecs(str){ const m=/^(\d+)([smhd])$/.exec(str); return m? +m[1]*UNIT[m[2]] : 0; }
const NOW = new Date(2026,4,28,14,30,0); // fixed "now" for absolute formatting
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function abs(offset){ const d=new Date(NOW.getTime()-offSecs(offset)*1000);
  const p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())} ${MON[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function worst(counts){ if(counts.failing>0) return "failing"; if(counts.running>0) return "running"; return "scheduled"; }
function dotClass(st){ return {failing:"d-fail",running:"d-run",scheduled:"d-sched",dormant:"d-dorm"}[st]||"d-sched"; }
function wordClass(st){ return {failing:"fail",running:"run",scheduled:"grey",dormant:"grey"}[st]||"grey"; }

// ---------- render one row ----------
function renderRow(t){
  const isMulti = t.st==="multi";
  const baseSt = isMulti ? worst(t.counts) : t.st;

  // marker
  let marker="";
  if(state.indicator==="dot-label" || state.indicator==="dot-only")
    marker = `<span class="dot ${dotClass(baseSt)}"></span>`;
  else if(state.indicator==="pill")
    marker = `<span class="pill ${dotClass(baseSt)}">${baseSt}</span>`;
  // label-only -> no marker

  // sub-line
  let sub="";
  const showWord = state.indicator==="dot-label" || state.indicator==="label-only";
  if(isMulti){
    const segs=[`<span class="grey">${t.inst} instances</span>`];
    if(t.counts.failing) segs.push(`<span class="fail">${t.counts.failing} failing</span>`);
    if(t.counts.running) segs.push(`<span class="run">${t.counts.running} running</span>`);
    if(t.counts.scheduled) segs.push(`<span class="grey">${t.counts.scheduled} scheduled</span>`);
    sub = segs.join(`<span class="grey"> · </span>`);
  } else {
    const parts=[];
    if(showWord) parts.push(`<span class="${wordClass(baseSt)}">${baseSt}</span>`);
    if(state.showDuration && baseSt==="failing" && t.failFor) parts.push(`<span class="${showWord?wordClass(baseSt):'fail'}">for ${t.failFor}</span>`);
    if(state.showDuration && baseSt==="running" && t.runFor)  parts.push(`<span class="${showWord?wordClass(baseSt):'run'}">for ${t.runFor}</span>`);
    let line = parts.join(" ");
    // instance count: one-time always; recurring only if toggled on
    if(t.section==="onetime") line += `<span class="grey"> · ${t.inst} instance${t.inst===1?"":"s"}</span>`;
    else if(state.recCount) line += `<span class="grey"> · 1 instance</span>`;
    if(!showWord && parts.length===0) line = `<span class="grey">${baseSt}</span>`; // dot/pill-only fallback word
    sub = line;
  }

  // next run
  let next="";
  const n=t.next;
  if(n.kind==="running") next = `<span class="run">${state.runLabel}</span>`;
  else if(n.kind==="in") next = `<span title="${abs(n.value)}">in ${n.value}</span>`;
  else if(n.kind==="soonest") next = `<span title="${abs(n.value)}">soonest in ${n.value}</span>`;
  else if(n.kind==="overdue") next = `<span class="over" title="${abs(n.value)}">due ${n.value} ago</span>`;
  else { next = `<span class="mute">—</span>`;
    if(t.abnormal) next += `<span class="warn" title="Recurring task with no next execution — may have failed to reschedule">⚠</span>`; }

  // last run
  let last="";
  const L=t.last||{};
  if(L.never) last = `<span class="mute">never run</span>`;
  else if(L.show==="failure") last = `<span class="fail">last failure ${state.lastFmt==="absolute"?abs(L.failure):L.failure+" ago"}</span>`;
  else if(L.show==="success") last = `<span class="ok">last success ${state.lastFmt==="absolute"?abs(L.success):L.success+" ago"}</span>`;
  else last = `<span class="mute">—</span>`;

  // link
  let link;
  if(t.st==="dormant") link = `<span class="mute">—</span>`;
  else if(isMulti) link = `<span class="link">→ list</span>`;
  else link = `<span class="link">→ instance</span>`;

  // tint
  let cls="card";
  if((isMulti?baseSt:t.st)==="failing" && state.tintFail) cls+=" tint-fail";
  if((isMulti?baseSt:t.st)==="running" && state.tintRun) cls+=" tint-run";

  return `<div class="${cls}">
    <div class="c-task"><span class="marker">${marker}</span>
      <div class="c-text"><div class="c-name">${t.name}</div><div class="c-sub">${sub}</div></div></div>
    <div class="c-next">${next}</div>
    <div class="c-last">${last}</div>
    <div class="c-link">${link}</div>
  </div>`;
}

// ---------- render page ----------
function renderPreview(){
  const rows = SCENARIOS[state.scenario];
  const rec = rows.filter(r=>r.section==="recurring");
  const one = rows.filter(r=>r.section==="onetime");
  const ov = document.getElementById("ov");
  ov.className = "ov" + (state.compact?" compact":"");

  let html = `<div class="topnav">
      <span class="brand"><span class="b-dot"></span>DB Scheduler UI</span>
      <span class="tab active">Overview</span>
      <span class="tab">Scheduled</span>
      ${state.historyTab?`<span class="tab">History</span>`:``}
      ${state.readOnly?`<span class="ro-badge">read-only</span>`:``}
    </div>
    <h2>All tasks</h2>
    <div class="colhdr"><span>TASK</span><span>NEXT RUN</span><span>LAST RUN</span><span></span></div>`;

  if(rec.length){
    html += `<div class="secthdr">RECURRING · ${rec.length}</div>` + rec.map(renderRow).join("");
  }
  if(one.length){
    html += `<div class="secthdr" style="padding-top:18px">ONE-TIME / CUSTOM · ${one.length}</div>` + one.map(renderRow).join("");
  }
  ov.innerHTML = html;
}

// ---------- prompt ----------
function updatePrompt(){
  const d=DEFAULTS, parts=[];
  const scenNames={spec:"the spec sample (all states)",healthy:"a healthy fleet",incident:"an incident with failures",deploy:"a fresh deploy (mostly dormant)",fanout:"a big fan-out (multi-instance)"};
  if(state.indicator!==d.indicator){
    const m={pill:"a pill/badge status indicator","label-only":"a word-only status label (no colored dot)","dot-only":"a dot-only status indicator (color is the ONLY signal — fails the spec's a11y rule)"};
    parts.push(`use ${m[state.indicator]} instead of the spec's dot + word`);
  }
  if(state.showDuration!==d.showDuration) parts.push(`drop the time-in-state duration from the sub-line (no "failing for 4d" / "running for 2h")`);
  if(state.recCount!==d.recCount) parts.push(`show the instance count on recurring rows too (e.g. "scheduled · 1 instance"), overriding the spec's recurring-rows-omit-count rule`);
  if(state.lastFmt!==d.lastFmt) parts.push(`render the LAST RUN column as absolute timestamps rather than relative ("${abs("3d")}" instead of "3d ago")`);
  if(state.runLabel!==d.runLabel) parts.push(`label running tasks "${state.runLabel}" in the NEXT RUN column instead of "running now"`);
  if(state.tintFail!==d.tintFail) parts.push(`remove the red background tint on failing rows`);
  if(state.tintRun!==d.tintRun) parts.push(`remove the blue background tint on running rows`);
  if(state.compact!==d.compact) parts.push(`use a compact row density (~44px rows, tighter padding)`);
  if(state.historyTab!==d.historyTab) parts.push(`hide the History nav tab (history disabled)`);
  if(state.readOnly!==d.readOnly) parts.push(`show a read-only badge in the header`);

  let out = `Implement the db-scheduler-ui "Overview" page per mockup/overview-tasks-table/MVP_1_overview_spec.md — a task-centric dashboard, one row per task name, split into RECURRING and ONE-TIME / CUSTOM sections (alphabetical, no pagination), status shown as a colored dot + word label, time-in-state sub-lines ("failing for 4d" = now − lastSuccess; "running for 2h" = now − executionTime, with "running now" kept in the NEXT RUN column), relative NEXT/LAST times with hover-absolute, and overdue → "due Xh ago" in orange.`;
  if(parts.length){
    out += `\n\nApply these changes vs. the spec defaults:\n` + parts.map(p=>`• ${p}`).join("\n");
  } else {
    out += `\n\n(Showing the spec defaults — no deviations selected.)`;
  }
  out += `\n\nPreviewing ${scenNames[state.scenario]||state.scenario} as sample data.`;
  document.getElementById("prompt").textContent = out;
}

function updateAll(){ renderPreview(); updatePrompt(); }

// ---------- wiring ----------
function bindToggle(id){ const el=document.getElementById(id);
  el.addEventListener("change",()=>{ state[id]=el.checked; updateAll(); }); }
["showDuration","recCount","tintFail","tintRun","compact","historyTab","readOnly"].forEach(bindToggle);
["scenario","indicator","runLabel"].forEach(id=>{ const el=document.getElementById(id);
  el.addEventListener("change",()=>{ state[id]=el.value; updateAll(); }); });
document.querySelectorAll("#lastFmt button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#lastFmt button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.lastFmt=b.dataset.v; updateAll(); }));

// ---------- presets ----------
const PRESETS = {
  "Spec default": {...DEFAULTS},
  "Compact + pills": {...DEFAULTS, indicator:"pill", compact:true},
  "Minimal (dots only)": {...DEFAULTS, indicator:"dot-only", showDuration:false, tintFail:false, tintRun:false},
  "Incident view": {...DEFAULTS, scenario:"incident"},
  "Read-only kiosk": {...DEFAULTS, readOnly:true, historyTab:false},
};
function applyPreset(p){
  Object.assign(state, PRESETS[p]);
  // reflect into controls
  ["showDuration","recCount","tintFail","tintRun","compact","historyTab","readOnly"].forEach(id=>document.getElementById(id).checked=state[id]);
  ["scenario","indicator","runLabel"].forEach(id=>document.getElementById(id).value=state[id]);
  document.querySelectorAll("#lastFmt button").forEach(b=>b.classList.toggle("on", b.dataset.v===state.lastFmt));
  updateAll();
}
const pc=document.getElementById("presets");
Object.keys(PRESETS).forEach(name=>{ const b=document.createElement("button"); b.textContent=name;
  b.addEventListener("click",()=>applyPreset(name)); pc.appendChild(b); });

// ---------- copy ----------
document.getElementById("copyBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("copyBtn"); const txt=document.getElementById("prompt").textContent;
  try{ await navigator.clipboard.writeText(txt);}catch(e){ const ta=document.createElement("textarea");
    ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const old=btn.textContent; btn.textContent="Copied!"; setTimeout(()=>btn.textContent=old,1200);
});

updateAll();
</script>
